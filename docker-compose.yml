# Pocket Parcels — follow every parcel in one place (Go + SQLite). One container, one volume.
services:
  pocket-parcels:
    image: ghcr.io/abjelosevic88/pocket-homelab-parcels:latest
    container_name: pocket-parcels
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 17TRACK key: every carrier followed automatically (AliExpress/Cainiao works without one)
      TRACK17_KEY: ${TRACK17_KEY:-}
      # Pocket Core: one sign-in and app links instead of tokens.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
